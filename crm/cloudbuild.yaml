# Builds the CRM image with build-args baked in. Needed because next.config
# rewrites() and NEXT_PUBLIC_* are evaluated at BUILD time, and
# `gcloud run deploy --source` does not forward build env vars to Dockerfile ARGs.
#
# Invoked by deploy/gcp-setup.sh (phase_crm) via:
#   gcloud builds submit crm --config crm/cloudbuild.yaml \
#     --substitutions _API_URL=...,_SITE_URL=...,_IMAGE=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
